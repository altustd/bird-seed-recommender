[workspace]
name = "bird-seed-recommender"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
streamlit = "*"
pandas = "*"
plotly = "*"
openpyxl = "*"
pytest = "*"
ipykernel = "*"

[tasks]
setup = "python -m ipykernel install --user --name bird-seed-recommender --display-name 'Python (bird-seed-recommender)'"
app = "streamlit run app.py"
cli = "python cli.py"
test = "pytest tests/ -v"

[activation]
env = { PYTHONPATH = "." }